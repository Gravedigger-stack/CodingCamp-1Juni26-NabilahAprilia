<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="notifications-container" aria-live="polite"></div>
    <header>
      <h1>Life Dashboard</h1>
      <button
        id="theme-toggle"
        aria-label="Switch to Dark Mode"
        onclick="ThemeManager.toggle()"
      >🌙 Dark Mode</button>
    </header>

    <main id="dashboard">
      <section id="greeting-widget" role="region" aria-labelledby="greeting-heading">
        <h2 id="greeting-heading" class="sr-only">Greeting</h2>
        <div id="clock" aria-live="polite">--:--:--</div>
        <div id="date-display"></div>
        <p id="greeting-text"></p>
        <form id="name-form">
          <label for="name-input">Your name</label>
          <input
            id="name-input"
            type="text"
            maxlength="50"
            placeholder="Enter your name…"
            autocomplete="off"
          />
          <button type="submit">Save</button>
          <span id="name-error" role="alert"></span>
        </form>
      </section>

      <section id="timer-widget" role="region" aria-labelledby="timer-heading">
        <h2 id="timer-heading">Focus Timer</h2>
        <div id="timer-display" aria-live="polite" aria-atomic="true">25:00</div>
        <div class="timer-controls">
          <button id="timer-start" aria-label="Start timer">Start</button>
          <button id="timer-stop" aria-label="Stop timer">Stop</button>
          <button id="timer-reset" aria-label="Reset timer">Reset</button>
        </div>
        <div id="timer-complete-msg" role="alert" hidden>Focus session complete! Great work.</div>
        <div class="duration-controls">
          <label for="duration-input">Duration (minutes)</label>
          <input id="duration-input" type="number" min="1" max="120" value="25" aria-label="Timer duration in minutes" />
          <button id="duration-apply" aria-label="Apply duration">Apply</button>
          <span id="duration-error" role="alert"></span>
        </div>
      </section>
      <section id="todo-widget" role="region" aria-labelledby="todo-heading">
        <h2 id="todo-heading">To-Do List</h2>
        <form id="todo-form">
          <label for="todo-input">New task</label>
          <input
            id="todo-input"
            type="text"
            maxlength="250"
            placeholder="Enter a task…"
            autocomplete="off"
          />
          <button type="submit" aria-label="Add task">Add</button>
          <span id="todo-input-error" role="alert"></span>
        </form>
        <div class="todo-sort">
          <label for="sort-order">Sort by</label>
          <select id="sort-order" aria-label="Sort tasks">
            <option value="none">None</option>
            <option value="incomplete-first">Incomplete first</option>
            <option value="completed-first">Completed first</option>
          </select>
        </div>
        <ul id="task-list" aria-label="Task list"></ul>
      </section>

      <section id="quicklinks-widget" role="region" aria-labelledby="quicklinks-heading">
        <h2 id="quicklinks-heading">Quick Links</h2>
        <form id="quicklink-form">
          <label for="link-label-input">Label</label>
          <input
            id="link-label-input"
            type="text"
            placeholder="Link label…"
            autocomplete="off"
            aria-label="Quick link label"
          />
          <span id="link-label-error" role="alert"></span>

          <label for="link-url-input">URL</label>
          <input
            id="link-url-input"
            type="url"
            placeholder="https://example.com"
            autocomplete="off"
            aria-label="Quick link URL"
          />
          <span id="link-url-error" role="alert"></span>

          <button type="submit" aria-label="Add quick link">Add Link</button>
        </form>
        <p id="link-limit-msg" role="alert" hidden>Maximum of 50 links reached. Delete a link to add a new one.</p>
        <div id="links-panel" aria-label="Saved quick links"></div>
      </section>
    </main>

    <script defer src="js/app.js"></script>
  </body>
</html>
